name: firestore_odm_builder
description: Code generator for Firestore ODM annotations. Generates type-safe Firestore operations from annotated classes.
version: 3.1.1
homepage: https://github.com/sylphxltd/firestore_odm
repository: https://github.com/sylphxltd/firestore_odm
issue_tracker: https://github.com/sylphxltd/firestore_odm/issues
documentation: https://sylphxltd.github.io/firestore_odm/
resolution: workspace

topics:
  - firestore
  - odm
  - code-generation
  - build-runner
  - flutter

environment:
  sdk: "^3.8.1"

dependencies:
  build: ^3.1.0
  source_gen: ">=3.0.0 <4.0.0"
  analyzer: ">=7.4.5 <8.0.0"
  fast_immutable_collections: ^11.0.4
  json_annotation: ^4.9.0
  # json_annotation: ">=6.0.0 <7.0.0"
  firestore_odm_annotation: ^3.0.2
  code_builder: ^4.10.1
  signals: ^6.0.2
  collection: ^1.19.1

dev_dependencies:
  build_runner: ^2.4.9
  very_good_analysis: ^9.0.0
# Publishing to pub.dev (default when omitted)
